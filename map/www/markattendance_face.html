<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Welcome to TimeTrax - Mobile App</title>
    <!-- Tell the browser to be responsive to screen width -->
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">
    <!-- Bootstrap 3.3.5 -->
    <link rel="stylesheet" href="css/bootstrap.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="css/font-awesome.css">    
     <!-- Timeline CSS -->
    <link href="css/timeline.css" rel="stylesheet">
    <!-- datetime -->
    <link href="css/bootstrap-datetimepicker.css" rel="stylesheet">
    <!-- Theme style -->
    <link rel="stylesheet" href="css/AdminLTE.css">
    <!-- AdminLTE Skins. Choose a skin from the css/skins
         folder instead of downloading all of them to reduce the load. -->
    <link rel="stylesheet" href="css/skin-blue.css">

    <!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
    <!--[if lt IE 9]>
        <script src="js/html5shiv.js"></script>
        <script src="js/respond.js"></script>
    <![endif]-->
</head>
<body>
    <div >
        <div >
            <!-- /.panel-heading -->
            <div class="panel-body">
                <div class="form-group">
                    <div class="col-sm-4">
                        <select class="form-control control-select" id="ddlActivityType">
                            <option value="0">- Activity - </option>
                            <option value="1">Day In</option>
                            <option value="2">Day Out</option>
                            <option value="3">Break Out</option>
                            <option value="4">Break In</option>
                            <option value="5">Field Visit Start</option>
                            <option value="6">Field Visit End</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-sm-4">
                        <div class="clockman">
                            <p class="time">
                                <span class="curdate"></span>
                            </p>
                            <p class="time ampm">
                                <span class="hour">00</span><span class="divider hm">:</span><span class="minutes">00</span>
                            </p>
                            <!-- .time -->
                        </div>
                    </div>
                </div>
                <!-- .clock -->
                <div class="form-group">
                    <div class="col-sm-4">
                        <div>
                            <video id="video" height="240" style="position: absolute; top: 10px; width: 300px;"
                                preload autoplay loop muted></video>
                            <canvas id="canvas" height="240" style="position: relative; top: 10px; width: 300px;"></canvas>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-sm-4">
                        <div id="divcurrentlocation">
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-sm-4">
                        <a href="#" class="btn btn-primary btn-block" id="btnSave">Submit</a>
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-sm-4">
                        <a href="locationOnMap.html" class="btn btn-primary btn-block">View Map</a>
                    </div>
                </div>
            </div>
            <!-- /.panel-body -->
            <!-- /.row -->
        </div>
        <!-- /#page-wrapper -->
    </div>
    <!-- /#wrapper -->
    <!-- jQuery -->

    <script src="js/jquery.js"></script>

    <!-- Bootstrap Core JavaScript -->

    <script src="js/bootstrap.js"></script>

    

    <script src="js/moment-with-locales.js"></script>

    <script src="js/bootstrap-datetimepicker.js"></script>

    <!-- Custom Theme JavaScript -->

    

    <script src="js/tracking.js"></script>

    <script src="js/face.js"></script>

    <script src="js/Attendance.js" type="text/javascript" charset="utf-8"></script>

    <!--<script src="js/dat.gui.min.js"></script>
    <script src="js/stats.min.js"></script>-->
</body>
</html>
