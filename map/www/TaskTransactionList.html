    <style>
        .assignmentlist:hover{
                background: #fef1e7;
        }
        .txtCompanyTit{font-weight: bold;}


        .inner-addon {
            position: relative;
            display: none;
        }
    
        /* style icon */
        .inner-addon .glyphicon {
            position: absolute;
            padding: 5px 10px 10px 10px;
            pointer-events: none;
        }
    
        .right-addon>input {
            border-radius: 50px;
            padding-left: 10px;
            padding-right: 10px;
        }
    
        /* align icon */
        .left-addon .glyphicon {
            left: 0px;
        }
    
        .right-addon .glyphicon {
            right: 0px;
        }
    
        /* add padding  */
        .left-addon input {
            padding-left: 30px;
        }
    
        .right-addon input {
            padding-right: 30px;
        }

  .panelshadow{
            box-shadow: 0px 0px 10px #ccc;
            border-radius: 10px;
            border:1px solid rgba(245, 120, 11, 0.295);
            position: relative;         
        }



        .surveytitle{
            padding: 4px;
            border-bottom:1px solid #ddd;
            display: block;
            font-weight:bold;   
            color: #777;  
            margin-bottom: 1%;  
            font-size: 18px;      
        }
        .surveyinfo{
            margin-top: 0%;
            padding: 2px;
            
        }
        .suveryfield{
            margin-top: 1%;
        }
        .surveylbl{
            color: rgb(165, 165, 165);
        }
        .surveytxt{
            color: #333;
        }
        .panelshadow:hover{
            background: #fafafa;
        }
        .form-group {
            margin-bottom: 2px !important;
        }
        .hdesc{
            background: #ddd;                      
        }
        .hdesc span{
            color: #333;
        }

        .groupDetail{
            padding: 2px;
            border:1px dashed #999;
            border-radius: 8px;
        }
        .groupItem{
            border-bottom: 1px solid #999;
            background: #fafafa;
        }

        .groupItem:hover{
            background: #fff;
        }
        hr{margin: 0;margin-bottom: 5px;margin-top: 5px;}
    </style>
