<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Welcome to TimeTrax - Mobile App</title>
    <!-- Tell the browser to be responsive to screen width -->
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
        name="viewport">
    <!-- Bootstrap 3.3.5 -->
    <link rel="stylesheet" href="css/bootstrap.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="css/font-awesome.css">
    <!-- Ionicons -->
    <!-- Theme style -->
    <link rel="stylesheet" href="css/AdminLTE.css">
    <!-- AdminLTE Skins. Choose a skin from the css/skins
         folder instead of downloading all of them to reduce the load. -->
    <link rel="stylesheet" href="css/skin-blue.css">
    <!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
    <!--[if lt IE 9]>
        <script src="js/html5shiv.js"></script>
        <script src="js/respond.js"></script>
    <![endif]-->
     <style>
        Html, body
        {
            height: 100%;
            margin: 0px;
            padding: 0px;
        }
        .grandParentContaniner
        {
            display: table;
            height: 100%;
            margin: 0 auto;
        }
        .parentContainer
        {
            display: table-cell;
            vertical-align: middle;
        }
        .parentContainer #loginForm
        {
            background: #fff;
            border: 0px solid #fff;
            padding: 10px;
            width: 300px; /*  your login form width */
        }
        .panel-title {
    padding: 0 0px;
}
    </style>
</head>
<body class="hold-transition login-page">
    <div class="grandParentContaniner">
    <div class="parentContainer">
        <!-- /.login-logo -->
        <div class="login-box-body">
            <div class="login-logo">
                <img src="img/logo-login.png" />
            </div>
            <div >
                <h3 class="panel-title">
                    App Activation
                </h3>
            </div>
            <div>
                <form role="form" id="activationForm">
                <div class="form-group">
                    <!--<span>Device ID</span><br />-->
                    <div id="divdid">
                    </div>
                </div>
                <div class="form-group">
                    <span>Full Name</span>
                    <input class="form-control" id="txtName" type="text" required>
                    <span>Email (will be used to inform on product updates)</span>
                    <input class="form-control" id="txtEmail" type="email" required>
                    <span>Activation Key</span>
                    <input class="form-control" id="txtAKey" type="text" required>
                </div>
                <div id="diverror">
                </div>
                <!-- Change this to a button or input when using this as a form -->
                <!--<a href="#" class="btn btn-primary btn-block" id="btnActivate">Activate</a>-->
                    <button type="submit" class="btn btn-primary btn-block" id="btnActivate">Activate</button>
                
                </form>
            </div>
        </div>
        <!-- /.login-box-body -->
    </div>
    <!-- jQuery -->
</div>
    <script src="js/jquery.js"></script>

    <!-- Bootstrap Core JavaScript -->

    <script src="js/bootstrap.js"></script>

    <script src="js/Jscookie.js"></script>


    <script type="text/javascript" charset="utf-8" src="cordova.js"></script>

    <script type="text/javascript" charset="utf-8" src="js/app.js"></script>

    <script type="text/javascript" charset="utf-8" src="js/AppActivation.js"></script>

</body>
</html>
