                                            <option value="1">Day Out</option>
                                            <option value="2">Break Out</option>
                                            <option value="3">Break In</option>
                                            <option value="4">Overtime Start</option>
                                            <option value="5">Overtime End</option>

                                        </select>
                                    </div>

                                                <span class="curdate"></span>
                                            </p>
                                            <p class="time ampm">
                                                <span class="hour">00</span><span class="divider hm">:</span><span

                                            </p>
                                            <!-- .time -->
                                        </div>
                                    </div>
                                </div>
