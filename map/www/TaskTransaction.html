                    <div class="col-lg-12">

                                <span id="wait" style="display: none;font-size: 18px;" class="fa fa-spinner fa-spin pull-right btn"></span>

                            </div>
                            <!-- /.panel-heading -->
                            <div class="panel-body">
                                <form class="form-horizontal" role="form">
                                    <div class="form-group">

                                        <label class="col-sm-2 control-label">Customer</label>
                                        <div class="col-sm-4">
                                            <select class="form-control control-select" id="ddlCustomer">
                                                <option value="0">- Select - </option>
                                            </select>
                                        </div>
                                        <label class="col-sm-2 control-label">Project</label>
                                        <div class="col-sm-4">
                                            <select class="form-control control-select" id="ddlProject">
                                                <option value="0">- Select - </option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="form-group">

                                        <label class="col-sm-2 control-label">Work Position</label>
                                        <div class="col-sm-4">
                                            <select class="form-control control-select" id="ddlWorkPosition">
                                                <option value="0">- Select - </option>
                                            </select>
                                        </div>
                                        <label class="col-sm-2 control-label">Task Type</label>
                                        <div class="col-sm-4">
                                            <select class="form-control control-select" id="ddlTaskType">
                                                <option value="0">- Select - </option>
                                            </select>
                                        </div>
                                    </div>




                                    <div class="form-group">
                                        <label class="col-sm-2 control-label">Work Date</label>
                                        <div class="col-sm-4">
                                            <div class='input-group date' id='datetimepicker1'>
                                                <input type='text' id="txtWorkDate" class="form-control" readonly />
                                                <span class="input-group-addon"><span class="glyphicon glyphicon-calendar"></span>
                                                </span>
                                            </div>
                                        </div>
                                        <label class="col-sm-2 control-label">Duration(hrs)</label>
                                        <div class="col-sm-4">
                                            <input class="form-control" id="txtDuration" type="number" placeholder="">
                                        </div>
                                    </div>


                                    <div class="form-group">
                                        <label for="Description" class="col-sm-2 control-label">
                                            Work Description
                                        </label>
                                        <div class="col-sm-10">
                                            <!-- <textarea class="form-control" id="txtWorkDescription" rows="3"></textarea> -->
                                            <textarea id="txtWorkDescription" name="editordata"></textarea>
                                        </div>
                                    </div>

                                    <div class="form-group" id="divddlStatus" style="display: none;">

                                        <label class="col-sm-2 control-label">Status</label>
                                        <div class="col-sm-4">
                                            <select class="form-control control-select" id="ddlStatus">
                                                <option value="0">- Select - </option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="form-group" style="display:none;">
                                        <label for="Description" class="col-sm-2 control-label">
                                            Upload File
                                        </label>
                                        <div class="col-sm-10">
                                            <input class="form-control" id="fileAttachment" type="file">
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <div class="col-sm-2">
                                        </div>
                                        <div class="col-sm-2">
                                            <button type="button" class="btn btn-primary btn-block" id="btnSave">Save</button>

                                        </div>
                                    </div>
