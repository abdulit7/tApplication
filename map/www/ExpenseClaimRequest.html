                                <center id="showProcess"><i class="fa fa-spinner fa-spin"></i></center>
                                <form id="formExpenseClaim" class="form-horizontal hide" role="form">


                                    <div class="NotForMileageExpense">


                                        <div class="form-group">
                                            <label class="col-sm-2 control-label">
                                                Claim Date</label>
                                            <div class="col-sm-4">
                                                <div class='input-group date' id='datetimepicker0'>
                                                    <input type='text' id="txtClaimDate" class="form-control" readonly />
                                                    <span class="input-group-addon"><span class="glyphicon glyphicon-calendar"></span>
                                                    </span>
                                                </div>
                                            </div>
                                            <label for="inputPassword" class="col-sm-2 control-label">
                                                Expense Date
                                            </label>
                                            <div class="col-sm-4">
                                                <div class='input-group date' id='datetimepicker1'>
                                                    <input type='text' id="txtExpenseDate" class="form-control"
                                                        readonly />

                                                    </span>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="form-group">
                                            <label class="col-sm-2 control-label">
                                                Expense Type</label>
                                            <div class="col-sm-4">
                                                <select class="form-control control-select" id="ddlExpenseType">
                                                    <option value="0">- Select - </option>
                                                </select>
                                            </div>
                                            <div class="col-sm-4">
                                                <div class="table-responsive" id="expenseBalDetail">
                                                </div>
                                            </div>

                                        </div>

                                    </div>

                                    <div class="form-group" id="divHidden" style="display: none;"">
                                        <label class="
                                        col-sm-2 control-label" id="lblCustomer" style="display: none;">
                                        Customer</label>
                                        <div class="col-sm-4" id="divCustomer" style="display: none;">
                                            <select class="form-control control-select" id="ddlCustomer">
                                                <option value="0">- Select - </option>
                                            </select>
                                        </div>
                                        <label class="col-sm-2 control-label" id="lblRoute" style="display: none;">
                                            Route
                                        </label>
                                        <div class="col-sm-4" id="divRoute" style="display: none;">
                                            <select class="form-control control-select" id="ddlRoute">
                                                <option value="0">- Select - </option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="NotForMileageExpense">


                                        <div class="form-group">
                                            <label class="col-sm-2 control-label">
                                                Rate</label>
                                            <div class="col-sm-4">
                                                <input class="form-control" id="txtRate" type="number" placeholder=""
                                                    disabled>
                                            </div>
                                        </div>

                                        <div class="form-group">
                                            <label class="col-sm-2 control-label">
                                                Quantity</label>
                                            <div class="col-sm-4">
                                                <input class="form-control" id="txtQuantity" type="number" placeholder="Quantity">
                                            </div>
                                            <label for="inputPassword" class="col-sm-2 control-label">
                                                Amount
                                            </label>
                                            <div class="col-sm-4">
                                                <input class="form-control" id="txtAmount" type="number" placeholder="Amount">
                                            </div>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label class="col-sm-2 control-label">
                                            Description</label>
                                        <div class="col-sm-4">
                                            <!-- <input class="form-control" id="txtDescription" type="text" placeholder="Description"> -->
                                            <textarea class="form-control" id="txtDescription" maxlength="200" rows="3"
                                                placeholder="Description"></textarea>
                                            <small class="pull-right">* Max 200 characters</small>
                                        </div>
                                    </div>

                                    <div class="ForMileageExpense hide">
                                        <table class="table table-border table-condensed">
                                            <tr>
                                                <td colspan="2"><a> <i class="fa fa-map-marker"> </i>&nbsp; Current
                                                        Location</a></td>
                                            </tr>
                                            <tr style="display: none;">
                                                <td style="width: 120px;">Latitude</td>
                                                <td id="lblLat">0</td>
                                            </tr>
                                            <tr style="display: none;">
                                                <td>Longitude</td>
                                                <td id="lblLong">0</td>
                                            </tr>
                                            <tr>
                                                <td colspan="2">
                                                    <div id="divcurrentlocation" style="padding:4px;box-shadow: 2px 2px 4px #999;border-radius: 4px;">

                                                    </div>
                                                </td>
                                            </tr>
                                        </table>
