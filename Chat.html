    <script>
        var _ReferenceType = 'Communication';
        $(document).ready(init);

        var startTime, endTime;
        //var prm = Sys.WebForms.PageRequestManager.getInstance();
        //prm.add_endRequest(init);

        function init() {

            var _winheight = jQuery(window).height();
            jQuery('.pnllistncontent').css('height', _winheight - 100 + 'px');
            jQuery('#result').css('height', _winheight - 180 + 'px');

            // Declare a proxy to reference the hub. 
            var communicationHub = $.connection.communicationHub;
            $.connection.hub.start().done(function () {
                if (isNull($)) { $ = jQuery.noConflict(); }

                //registerEvents(acHub, $)
                //registerClientMethods(communicationHub);
                communicationHub.server.onConnecte('');

                $('#listUser').html('<ul>hi</ul>');
                var res = communicationHub.server.getUserList('Communication');
                //res = JSON.parse(res);
                //console.log({res});

                $('#btnSend').click(function (e) {
                    communicationHub.server.send($('#txtName').val());
                });

            });

            //console.log('typeof $.connection.hub.stop : ', typeof $.connection.hub.stop);

            //$('#btnCancelProcess').click(function () {
            //    $.connection.hub.stop();
            //});

            registerClientMethods(communicationHub);
        }

        function getChating(pEid, pEname) {

            jQuery('.usritm').removeClass('selectedUser');
            jQuery('.usritm' + pEid).addClass('selectedUser');

            jQuery('#curentActiveUserTitle').html(pEname);
            jQuery('#currentEmpID').val(pEid);
            getUserChat(0, 0, 0, pEid, true, _ReferenceType, 0);

            if (jQuery(window).width() <= 786) {
                jQuery('#pnlUserList').css('left', '-100%');
                //var _winheight = jQuery(window).height();
                //jQuery('.pnllistncontent').css('height', _winheight - 90 + 'px');
                //jQuery('.currentUserImg').css('display', 'none');

            }

            //alert(pEname);
        }

        function getUserChat(pConversationID, pLastTranID, pLastUpdateID, pReciverID, pIsNewChat, pReferenceType, pReferenceID) {
            var data =
            {
                ConversationId: pConversationID,
                LastUpdateId: pLastUpdateID,
                ReceiverID: pReciverID,
                IsNewChat: pIsNewChat,
                LastTranID: pLastTranID,
                ReferenceType: pReferenceType,
                ReferenceID: pReferenceID
            }

            // if (chatInterval) {
            //     chatInterval = clearInterval(chatInterval);
            // }


            postRequest('WSCommunication.asmx/GetUpdates', JSON.stringify(data), function (r) {
                ////console.log(r.d);

                if (r.d.length <= 0) {
                    if (pIsNewChat) {
                        jQuery('#result').html('<center>Chat not start yet!</center>');
                    } else {
                        jQuery('#result').append('');
                    }
                    return;
                }

                if (r.d.length > 0) {
                    var template = '';
                    jQuery.each(r.d, function (i, item) {
                        var isRead = '';
                        if (item.IsRead === true) {
                            isRead = ' &nbsp;<i class="fa fa-check" style="color:#80D8FF;"></i>';
                        } else {
                            isRead = ' &nbsp;<i class="fa fa-check" style="color:#ddd;"></i>';
                        }


                        var senderDiv = '';
                        //var reciverDiv = '';
                        if (item.CssClass.indexOf('Sender') > -1) {
                            isRead = '';
                        }
                        senderDiv = '<div style="text-align:right;" ><div class="panel ' + item.CssClass + '"><p>' + item.MessageText + '</p> <span class="pull-right itemdate">' + item.TranDate + isRead + '</span> </div></div>';
                        //} else {
                        //senderDiv = '<div style="text-align:left;"><div class="panel ' + item.CssClass + '"><p>' + item.MessageText + '</p> <span class="pull-right itemdate">' + item.TranDate + '</span> </div></div>';
                        //}
                        template += senderDiv;
                        //$("#contentarea").scrollTop($("#contentarea")[0].scrollHeight);
                        scrollToBottom('result');

                        if (i === r.d.length - 1) {
                            //alert(item.TranID);
                            //jQuery('#ctl00_ContentPlaceHolder1_hidLastTranID').val(item.TranID);
                        }

                    });

                    if (pIsNewChat) {
                        jQuery('#result').html(template);
                    } else {
                        jQuery('#result').append(template);
                    }
                    scrollToBottom('result');

                } else {
                    template = '';
                    jQuery('#result').html('');
                }

            });

        }

        function scrollToBottom(pstrID) {
            var objDiv = document.getElementById(pstrID);
            objDiv.scrollTop = objDiv.scrollHeight;
        }

        function registerClientMethods(communicationHub) {

            var userID = $('#hidUserID');
            
            communicationHub.client.connected = function (pID) {
                userID.val(pID);
            }

            communicationHub.client.getUserList = function (res) {
                
                res = JSON.parse(res);
                //console.table(res);
                var template = '';
                $.each(res,function(i,item){
                    var para = item.EmployeeID + '^' + item.EmployeeName;
                    var unRead = item.UnreadMsg > 0 ? '<span class="badge pull-right">' + item.UnreadMsg + '</span>' : '';
                    var lastMsg = item.LastMessage !== '' ? item.LastMessage.split('^')[0] : '';  //.length > 0 ? item.LastMessage : '';
                    var lastMsgDate = item.LastMessage !== '' ? item.LastMessage.split('^')[1] : '';
                    var tdate = item.LastMessage !== '' ? new Date(item.LastMessage.split('^')[1]) : '';
                    var today = new Date();
                    if (tdate !== '') {

                        if (tdate.getDay() === today.getDay() && tdate.getMonth() === today.getMonth() && tdate.getFullYear() === today.getFullYear()) {
                            //tdate = tdate.getHours() + ':' + tdate.getMinutes();
                            tdate = formatAMPM(tdate);
                        } else {
                            tdate = tdate.getDay() + '/' + tdate.getMonth() + '/' + tdate.getFullYear();
                        }
                    }

                    if (isHTML(lastMsg)) {
                        lastMsg = 'can\'t preview this message.';
                    }


                    template += '<li class="list-group-item usritm usritm' + item.EmployeeID + '" onclick="getChating(' + item.EmployeeID + ' ,\'' + item.EmployeeName + '\')">' +
                        '<div class="row">' +
                        '<div class="col-xs-2">' +
                        '<img width="30px" class="img imgListUser" src="images/avataruser.png" alt="" srcset="">' +
                        '</div>' +
                        '<div class="col-xs-10">' +
                        '<span class="listUserTitle">' + item.EmployeeName + '</span> <span class="pull-right">' + tdate + '</span>' +
                        '<br>' +
                        '<span style="color:#999;">' + lastMsg.substr(0, 30) + ' ...</span>' +
                        unRead +
                        '</div>' +
                        '</div>' +
                        '</li>';
                });
                $('#listUser').html(template);
            }

            communicationHub.client.sendResponse = function (pResult) {
                //alert(pResult);
                //$('#area').append('<br>' + pResult);
                var id = pResult.split(':')[0].trim();
                //alert(userID.val());
                if (id == userID.val()) {
                    $('#area').append('<br><span style="background:#999;">' + pResult + '</span>');
                } else {
                    $('#area').append('<br>' + pResult);
                }

            }

        }

        function formatAMPM(date) {
            var hours = date.getHours();
            var minutes = date.getMinutes();
            var ampm = hours >= 12 ? 'pm' : 'am';
            hours = hours % 12;
            hours = hours ? hours : 12; // the hour '0' should be '12'
            minutes = minutes < 10 ? '0' + minutes : minutes;
            var strTime = hours + ':' + minutes + ' ' + ampm;
            return strTime;
        }

        function isHTML(str) {
            var a = document.createElement('div');
            a.innerHTML = str;

            for (var c = a.childNodes, i = c.length; i--;) {
                if (c[i].nodeType == 1) return true;
            }

            return false;
        }

    </script>
