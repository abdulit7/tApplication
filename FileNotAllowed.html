<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title></title>
    <style>
        .center {
            margin: auto;
            width: 50%;
            width: 100%;
            opacity: 0.2;
            position: absolute;
            margin: auto;
            width: 100%;
            height: auto;
            top: -50%;
            bottom: -50%;
            left: -50%;
            right: -50%;
        }

        .blackbox {
            width: 60%;
            background: rgba(0,0,0,0.5);
            padding: 20px;
            margin: 0 auto;
            color: #fff;
            border-radius: 10px;
            font-family: sans-serif;
            position: absolute;
            height: 280px;
            top: 25%;
            bottom: -25%;
            left: -50%;
            right: -50%;
            overflow:hidden;            
            text-overflow: ellipsis;
            word-wrap: break-word;            
        }
        span {
            color : #f5821f;            
        }
    </style>
</head>
<body>
    <img src="/timetraxweb/app_themes/timetrax/images/logo-login.png" alt="invalidfile" class="center" />
    <div class="blackbox">
        <h1>
            <i>Cannot process your request.</i>
            <br /><br />
            It looks like you are trying to upload un-allowed files.
            <br /><br />
            File : <span id="fileName"></span>
        </h1>
    </div>

    <script>

        function getParameterByName(name, url) {
            if (!url) url = window.location.href;
            name = name.replace(/[\[\]]/g, "\\$&");
            var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)"),
                results = regex.exec(url);
            if (!results) return null;
            if (!results[2]) return '';
            return decodeURIComponent(results[2].replace(/\+/g, " "));
        }

        var fileName = document.getElementById("fileName");
        fileName.innerText = "" + getParameterByName("f");
    </script>

</body>
</html>
